name: Build D.Ch AI Local EXE

on:
  push:
    branches: [dchai-local-exe]
    paths:
      - "DChAI_Local/**"
      - ".github/workflows/build-dchai-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller SpeechRecognition PyAudio
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DChAI_Local --collect-all speech_recognition DChAI_Local/app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DChAI_Local-Windows-EXE
          path: dist/DChAI_Local.exe
          if-no-files-found: error
          retention-days: 30
